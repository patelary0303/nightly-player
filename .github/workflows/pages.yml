# Publishes the player from main plus the recorded episodes from the "audio"
# branch (served under episodes/).
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site/episodes
          cp index.html _site/
          if git ls-remote --exit-code origin audio >/dev/null; then
            git fetch -q origin audio
            git --work-tree=_site/episodes checkout origin/audio -- .
          fi
          ls -la _site/episodes

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
